name: rezepte-api-pg15

services:
  db:
    image: postgres:15
    container_name: pg-db-15
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: syntax_db
    ports:
      - "5433:5432" # Host-Port 5433, da 5432 bereits von PostgreSQL 18 belegt ist
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
