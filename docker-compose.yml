name: rezepte-api-pg15

services:
  db:
    image: postgres:15
    container_name: pg-db-15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432" # links = Port auf meinem Rechner (5433), rechts = Port im Container (5432)
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
